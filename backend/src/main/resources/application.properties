spring.application.name=instituto-linguas-gestao
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/il_gestao}
spring.datasource.username=${DB_USER:il_app}
spring.datasource.password=${DB_PASSWORD:senha_local_apenas_dev}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Credenciais obrigatórias. Nunca guardar palavras-passe no repositório.
admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}
